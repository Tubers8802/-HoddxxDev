-- Función de arrastre (movimiento del menú)
local dragging = false
local dragStart = Vector2.new()
local frameStart = UDim2.new()

dragBar.InputBegan:Connect(function(input)
    if input.UserInputType == Enum.UserInputType.MouseButton1 then
        dragging = true
        dragStart = input.Position
        frameStart = menuFrame.Position
    end
end)

dragBar.InputEnded:Connect(function(input)
    if input.UserInputType == Enum.UserInputType.MouseButton1 then
        dragging = false
    end
end)

game:GetService("UserInputService").InputChanged:Connect(function(input)
    if dragging and input.UserInputType == Enum.UserInputType.MouseMovement then
        local delta = input.Position - dragStart
        local newX = frameStart.X.Offset + delta.X
        local newY = frameStart.Y.Offset + delta.Y
        menuFrame.Position = UDim2.new(frameStart.X.Scale, newX, frameStart.Y.Scale, newY)
    end
end)

-- Función para dar dinero
local function giveMoney()
    local args = {
        9999999999999999999999999999999999999999999999999,
        1
    }
    local remote = game:GetService("ReplicatedStorage"):WaitForChild("CashOutEvent")
    remote:FireServer(unpack(args))
end

-- Conectar acciones
moneyButton.MouseButton1Click:Connect(giveMoney)

